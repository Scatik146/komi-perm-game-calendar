name: Поиск картинок (временно)

on:
  push:
    branches: [kartinki-poisk]

permissions:
  contents: write

jobs:
  poisk:
    if: "!contains(github.event.head_commit.message, '[kandidaty]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/kartinki-poisk.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add kartinki-poisk
          git commit -m "Кандидаты картинок с Викисклада [kandidaty]"
          git push
